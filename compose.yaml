name: paper-finder

services:
  paper-finder:
    build: .
    image: paper-finder:local
    environment:
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data:ro
      - ./output:/app/output
    restart: "no"
